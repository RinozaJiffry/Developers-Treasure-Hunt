<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Treasure Hunt</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #f5f5dc;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-image: url('https://img.freepik.com/free-vector/treasure-map-background_23-2147949482.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }
        
        .container {
            background-color: rgba(255, 255, 255, 0.9);
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.3);
            padding: 30px;
            width: 80%;
            max-width: 600px;
            text-align: center;
        }
        
        h1 {
            color: #8B4513;
            font-size: 2.5em;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.2);
        }
        
        #clue {
            font-size: 1.2em;
            margin-bottom: 30px;
            padding: 15px;
            background-color: #fff8dc;
            border-radius: 5px;
            border-left: 5px solid #daa520;
        }
        
        #answer-form {
            margin-bottom: 20px;
        }
        
        input[type="text"] {
            padding: 10px;
            width: 70%;
            border: 2px solid #daa520;
            border-radius: 5px;
            font-size: 1em;
        }
        
        button {
            padding: 10px 20px;
            background-color: #daa520;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1em;
            transition: background-color 0.3s;
        }
        
        button:hover {
            background-color: #b8860b;
        }
        
        #result {
            margin-top: 20px;
            font-weight: bold;
            min-height: 24px;
        }
        
        .correct {
            color: green;
        }
        
        .incorrect {
            color: red;
        }
        
        #progress {
            margin-top: 20px;
            font-size: 0.9em;
            color: #8B4513;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Treasure Hunt</h1>
        <div id="clue">Loading your first clue...</div>
        <form id="answer-form">
            <input type="text" id="answer" placeholder="Enter your answer" required>
            <button type="submit">Submit</button>
        </form>
        <div id="result"></div>
        <div id="progress">Clue: 0/10</div>
    </div>

    <script src="index.js"></script>
</body>
</html>
